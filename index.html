<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Option Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="question-screen">
        <h1>I think i like you, you're cute, sexy and fun. Will you be my BOYFRIEND?</h1>
        <button id="option-1">UM NO?</button>
        <button id="option-2">Ofcourse. I like you too, you're the best<3</button>
    </div>

    <div id="next-screen" style="display: none;">
        <h2>Congratulations! You chose the correct option!</h2>
        <p>Hi Boyfriend🥰 Happy 19th</p>
    </div>

    <!-- Audio element for background music -->
    <audio id="careless" src="careless.mp3" preload="auto"></audio>

    <!-- Include the confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>

    <!-- Link to the JavaScript file -->
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Option Game</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Include Playfair Display and Silkscreen fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
</head>
<body>
    <div id="question-screen">
        <h1>What is the correct answer?</h1>
        <button id="option-1">Option 1</button>
        <button id="option-2">Option 2</button>
    </div>

    <div id="next-screen" style="display: none;">
        <div id="text-content">
            <h2>Congratulations! You chose the correct option!</h2>
            <div class="typewriter">Here is some written text that is shown on the next screen.</div>
        </div>
    </div>

    <!-- Audio element for background music -->
    <audio id="careless" src="careless.mp3" preload="auto"></audio>

    <!-- Include the confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>

    <!-- Link to the JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
